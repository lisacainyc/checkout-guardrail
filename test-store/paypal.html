<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="store.css" />
  </head>
  <body class="frame-body">
    <button type="button" id="paypal" class="button paypal">Buy with PayPal</button>
    <script>
      // Navigate the whole page, the way real PayPal buttons take over checkout.
      document.getElementById('paypal').addEventListener('click', () => {
        window.top.location.href = 'order-placed.html?via=paypal'
      })
    </script>
  </body>
</html>
