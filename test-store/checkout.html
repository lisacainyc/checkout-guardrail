<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout - Test Store</title>
    <link rel="stylesheet" href="store.css" />
  </head>
  <body>
    <header class="banner">Test Store: fake shop for testing OptOut</header>
    <main>
      <h1>Checkout</h1>

      <section class="express">
        <h2>Express checkout</h2>
        <!-- PayPal lives in an iframe, like on real stores. -->
        <iframe class="paypal-frame" src="paypal.html" title="PayPal"></iframe>
        <button type="button" id="apple-pay" class="button apple-pay">&#63743; Pay</button>
      </section>

      <form id="checkout-form" action="order-placed.html" method="get">
        <section>
          <h2>Order summary</h2>
          <ul class="items">
            <li class="item">
              <span class="item-name">Wireless headphones</span>
              <span class="item-price">$79.99</span>
            </li>
            <li class="item">
              <span class="item-name">Phone case</span>
              <span class="item-price">$19.99</span>
            </li>
          </ul>
          <p class="total-row">Total: <span id="order-total">$99.98</span></p>
        </section>

        <section>
          <h2>Shipping</h2>
          <label>Email <input type="email" name="email" value="test@example.com" /></label>
        </section>

        <section>
          <h2>Payment</h2>
          <!-- Fake card field. OptOut must never read it. -->
          <label>Card number <input type="text" id="card-number" value="4242 4242 4242 4242" autocomplete="off" /></label>
        </section>

        <input type="hidden" name="via" value="place-order" />
        <button type="submit" id="place-order" class="button primary">Place order</button>
      </form>
    </main>

    <script>
      // Apple Pay uses a JavaScript click handler instead of a form.
      document.getElementById('apple-pay').addEventListener('click', () => {
        location.href = 'order-placed.html?via=apple-pay'
      })
    </script>
  </body>
</html>
